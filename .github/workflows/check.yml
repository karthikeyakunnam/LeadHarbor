name: Verify LeadHarbor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check leadharbor/static/app.js
      - run: python scripts/check_workflows.py
      - run: python scripts/build_workflows.py && git diff --exit-code workflow.json workflows/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leadharbor:test .
